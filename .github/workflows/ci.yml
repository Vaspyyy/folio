name: CI

on:
  push:
    branches: [main, feat/for-you-recommendations]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --check
      - name: Install extension-capable Chromium
        run: npx playwright install --with-deps chromium
      - name: Resolve Chromium
        shell: bash
        run: |
          BROWSER_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
      - run: npm run test:browser
      - run: npm run test:portable:browser
      - run: npm run test:companion

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - run: npm ci
      - run: npm run build:android
      - run: apps/android/gradlew --no-daemon -p apps/android lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Folio-debug-apk
          path: build/android/Folio-debug.apk
          if-no-files-found: error
